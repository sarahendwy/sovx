{% extends 'dashboard.html' %}
{% load static %}

{% block admin_content %}
    {% include "partials/components/form.html" with form_title="تعديل قائمة المنتجات" form_class="product-list-form" form_button_text="حفظ" %}

    <script>
        (function () {
            var selectAllField = document.getElementById('id_select_all_products');
            var productIdsField = document.getElementById('id_product_ids');
            if (!selectAllField || !productIdsField) return;
            var productIdsContainer = productIdsField.closest('.mb-3');

            function toggleProductIds() {
                productIdsField.disabled = selectAllField.checked;
            }

            selectAllField.addEventListener('change', toggleProductIds);
            toggleProductIds();
        })();
    </script>
{% endblock admin_content %}
