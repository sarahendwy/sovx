{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="py-2 py-md-4">
        <h1 class="cormorant-garamond-regular mb-5">All {{ category|title }} Products</h1>
        <div class="container text-center">
            <div class="row justify-content-center">
                {% for product in products %}
                    {% include "partials/components/product_card.html" with product=product %}
                {% endfor %}
            </div>
            {% include 'partials/layout/paginator.html' %}
        </div>
    </div>
{% endblock content %}
