<section id="section_{{ section.id }}">
    {% if section.banner %}
        <img src="{{ section.banner.url }}" alt="{{ section.name }}" class="img-fluid mb-3 banner" />
    {% endif %}

    {% if products %}
        <div class="product-list">
            {% for product in products %}
                {% include "partials/components/product_card.html" with product=product %}
            {% endfor %}
        </div>
    {% endif %}
</section>
