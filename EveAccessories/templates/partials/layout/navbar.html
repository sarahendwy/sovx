{% load static %}

<nav class="site-navbar bg-white position-sticky" aria-label="Main navigation">
  <div
    id="top-bar"
    class="w-100 h-100 d-flex align-items-center gap-2 gap-sm-3"
  >
    <a class="site-navbar-brand" href="/" aria-label="Home">
      <img
        src="{% static 'images/logo.svg' %}"
        alt="SOVX"
        class="img-fluid d-block"
      />
    </a>
    <form
      method="get"
      class="site-navbar-search position-relative ms-auto"
      role="search"
      action="{% url 'products' %}"
    >
      <input
        type="search"
        name="query"
        placeholder="دور على اللي نفسك فيه..."
        aria-label="Search"
        class="form-control bg-white border rounded-2 shadow-none"
      />

      <svg
        class="position-absolute top-50 end-0 translate-middle-y me-2 pe-none"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="6.5" stroke="#a5a5a5" stroke-width="1.5" />
        <path
          d="m16 16 4 4"
          stroke="#a5a5a5"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </form>
    <!-- </div> -->
    <div
      class="d-flex align-items-center gap-2 text-nowrap"
      aria-label="Current language: English"
    >
      <svg
        class="site-navbar-flag d-block overflow-hidden rounded-circle"
        viewBox="0 0 60 60"
        aria-hidden="true"
      >
        <defs>
          <clipPath id="uk-flag-circle">
            <circle cx="30" cy="30" r="30" />
          </clipPath>
        </defs>
        <g clip-path="url(#uk-flag-circle)">
          <rect width="60" height="60" fill="#21468b" />
          <path d="M0 0 60 60M60 0 0 60" stroke="#fff" stroke-width="13" />
          <path d="M0 0 60 60M60 0 0 60" stroke="#cf142b" stroke-width="6" />
          <path d="M30 0v60M0 30h60" stroke="#fff" stroke-width="19" />
          <path d="M30 0v60M0 30h60" stroke="#cf142b" stroke-width="11" />
        </g>
      </svg>
      <span class="body-small text-secondary">English</span>
    </div>
    <a
      class="site-navbar-cart position-relative d-flex align-items-center justify-content-center flex-shrink-0 text-decoration-none"
      href="{% url 'cart' %}"
      aria-label="Shopping cart"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 5h2l1.6 8.2a2 2 0 0 0 2 1.6h6.8a2 2 0 0 0 2-1.6L19.5 8H7"
          stroke="var(--primary)"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="10" cy="18.5" r="1" fill="var(--primary)" />
        <circle cx="17" cy="18.5" r="1" fill="var(--primary)" />
      </svg>
    </a>
  </div>

  {% if sections %}
  <div class="w-100 d-flex align-items-center">
    <ul
      id="navbarSectionsNav"
      class="site-navbar-links navbar-nav flex-row flex-nowrap overflow-auto mb-0"
    >
      {% for section in sections %}
      <li class="nav-item">
        <a class="nav-link text-secondary" href="#section_{{section.id}}"
          >{{section.name}}</a
        >
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</nav>
