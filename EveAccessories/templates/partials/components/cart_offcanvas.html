<div
  class="offcanvas offcanvas-start cart-offcanvas"
  tabindex="-1"
  id="cartOffcanvas"
  aria-labelledby="cartOffcanvasLabel"
>
  <div class="offcanvas-header bg-weak flex justify-content-between align-items-center">
    <h5 class="offcanvas-title" id="cartOffcanvasLabel">السلة</h5>
    <button
      type="button"
      class="btn-close m-0"
      data-bs-dismiss="offcanvas"
      aria-label="Close"
    ></button>
  </div>
  <div class="offcanvas-body p-0 d-flex flex-column justify-content-between" data-cart-panel-body>
    <div class="cart-items-list" data-cart-items-list></div>
    <div class="text-center">
      <p class="text-gray bg-weak text-end body-small py-1 px-4">تفاصيل الدفع</p>
      <div class="cart-totals py-3 px-4 text-secondary">
        <div class="cart-total" id="cart-subtotal">
          <span class="body-small">المجموع الفرعي</span>
          <div>
            <span class="text-gray amount text-dark" data-cart-subtotal>0.00</span>
            <span class="text-gray caption">جـ . مـ</span>
          </div>
        </div>
        <div class="cart-total" id="cart-shipping" data-cart-shipping="{{ site_settings.default_shipping_fees|default:0 }}">
          <span class="body-small">رسوم التوصيل</span>
          <div>
            <span class="text-gray amount text-dark" data-cart-shipping-amount>{{ site_settings.default_shipping_fees|default:0|floatformat:2 }}</span>
            <span class="text-gray caption">جـ . مـ</span>
          </div>
        </div>
        <hr class="mt-0 mb-2"/>
        <div class="cart-total" id="cart-total">
          <span class="body-small">المجموع الكلي</span>
          <div>
            <span class="text-gray amount text-dark" data-cart-grand-total>0.00</span>
            <span class="text-gray caption">جـ . مـ</span>
          </div>
        </div>

      </div>
      <a class="btn btn-primary mt-3" href="{% url 'create_order' %}">
        استكمال الشراء
      </a>
    </div>
  </div>
</div>

<script>
  if (!window.__cartOffcanvasInit) {
    window.__cartOffcanvasInit = true;

    // Mirrors ProductBuyingOption.unit choices (accessories/models.py) —
    // cart items only carry the raw key, not the Django display label.
    const UNIT_LABELS = { piece: 'قطعة', kg: 'كيلوجرام', g: 'جرام', liter: 'لتر' };
    const unitLabel = function (unit) {
      return UNIT_LABELS[unit] || unit || '';
    };

    const formatAmount = function (value) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(2) : '0.00';
    };

    const createQtyButton = function (symbol, action, label) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cart-item-qty-btn';
      btn.textContent = symbol;
      btn.setAttribute('data-qty-' + action, '');
      btn.setAttribute('aria-label', label);
      return btn;
    };

    const createItemRow = function (item) {
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.dataset.itemId = String(item.id);

      // First child = visual right under this page's dir="rtl".
      const thumb = document.createElement('img');
      thumb.className = 'cart-item-thumb';
      thumb.src = item.thumbnail || '';
      thumb.alt = item.title || '';
      row.appendChild(thumb);

      const info = document.createElement('div');
      info.className = 'cart-item-info';

      const title = document.createElement('p');
      title.className = 'cart-item-title caption text-dark';
      title.textContent = item.title;
      info.appendChild(title);

      const option = document.createElement('p');
      option.className = 'cart-item-option tiny text-gray py-1';
      option.textContent = item.amount + ' ' + unitLabel(item.unit);
      info.appendChild(option);

      const price = document.createElement('p');
      price.className = 'cart-item-price body-small text-dark';
      price.textContent = formatAmount(item.price) + ' ';
      const priceCurrency = document.createElement('span');
      priceCurrency.className = 'caption text-gray';
      priceCurrency.textContent = 'جـ . مـ';
      price.appendChild(priceCurrency);
      info.appendChild(price);

      row.appendChild(info);

      const qty = document.createElement('div');
      qty.className = 'cart-item-qty';

      const incBtn = createQtyButton('+', 'increment', 'زيادة الكمية');
      incBtn.disabled = item.stock != null && item.quantity >= item.stock;
      qty.appendChild(incBtn);

      const qtyValue = document.createElement('span');
      qtyValue.className = 'cart-item-qty-value';
      qtyValue.textContent = String(item.quantity);
      qty.appendChild(qtyValue);

      qty.appendChild(createQtyButton('-', 'decrement', 'إنقاص الكمية'));

      row.appendChild(qty);
      return row;
    };

    const render = function () {
      if (!window.Cart) return;
      const list = document.querySelector('[data-cart-items-list]');
      if (!list) return;

      const items = window.Cart.getItems();
      list.replaceChildren();

      if (items.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'text-center text-secondary body-small py-5 mb-0';
        empty.textContent = 'السلة فارغة';
        list.appendChild(empty);
      } else {
        items.forEach(function (item) {
          list.appendChild(createItemRow(item));
        });
      }

      const subtotal = window.Cart.getSubtotal();
      const subtotalEl = document.querySelector('[data-cart-subtotal]');
      const grandTotalEl = document.querySelector('[data-cart-grand-total]');
      if (subtotalEl) subtotalEl.textContent = formatAmount(subtotal);

      // No city is known yet at this point in the flow, so real per-city
      // shipping (dashboard.models.ShippingFee) can't be resolved here —
      // fall back to the site-wide Setting.default_shipping_fees, rendered
      // server-side onto the shipping row's data attribute.
      const shippingRow = document.getElementById('cart-shipping');
      const shippingFee = shippingRow ? Number(shippingRow.dataset.cartShipping) || 0 : 0;
      if (grandTotalEl) grandTotalEl.textContent = formatAmount(subtotal + shippingFee);
    };

    document.addEventListener('click', function (e) {
      if (!window.Cart) return;
      const list = document.querySelector('[data-cart-items-list]');
      if (!list || !list.contains(e.target)) return;

      const row = e.target.closest('[data-item-id]');
      if (!row) return;
      const id = Number(row.dataset.itemId);

      if (e.target.closest('[data-qty-increment]')) {
        window.Cart.increment(id);
      } else if (e.target.closest('[data-qty-decrement]')) {
        window.Cart.decrement(id);
      }
    });

    window.addEventListener('cart:change', render);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', render);
    } else {
      render();
    }
  }
</script>
